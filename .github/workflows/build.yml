name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تثبيت الجافا 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: تثبيت الفلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: تثبيت الحزم
        run: flutter pub get

      # 👇 توحيد التوافقية وإلغاء التوقيع المسبب للمشاكل في خطوة واحدة
      - name: توحيد توافقية أندرويد و Gradle واصلاح التوقيع
        run: |
          mkdir -p android/gradle/wrapper
          cat <<EOF > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          if [ -f android/settings.gradle ]; then
            sed -i -E 's/id "com.android.application" version "[^"]+"/id "com.android.application" version "8.7.0"/g' android/settings.gradle
            sed -i -E "s/id 'com.android.application' version '[^']+'/id 'com.android.application' version '8.7.0'/g" android/settings.gradle
          fi

          if [ -f android/build.gradle ]; then
            sed -i -E 's/com.android.tools.build:gradle:[0-9.]+/com.android.tools.build:gradle:8.7.0/g' android/build.gradle
          fi

          if [ -f android/app/build.gradle ]; then
            sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle
          fi

      - name: بناء التطبيق
        run: flutter build apk --debug

      - name: توفير الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: school-app-debug
          path: build/app/outputs/**/*.apk
