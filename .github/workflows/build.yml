name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب كود المشروع
        uses: actions/checkout@v4

      - name: تثبيت الجافا
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: تثبيت الفلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: تحميل مكتبات المشروع
        run: flutter pub get

      # 👇 تم دمج توليد المفاتيح والبناء معاً في خطوة واحدة لضمان التنفيذ الإجباري
      - name: توليد المفاتيح وبناء الـ APK
        run: |
          mkdir -p android/app
          
          # 1. توليد المفتاح
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=SchoolApp, OU=Dev, O=School, L=Djelfa, S=DZ, C=DZ"
          
          # 2. إنشاء ملف key.properties بالمسار المطلق
          cat <<EOF > android/key.properties
          storePassword=123456
          keyPassword=123456
          keyAlias=upload
          storeFile=$GITHUB_WORKSPACE/android/app/upload-keystore.jks
          EOF
          
          # 3. نسخ الإعدادات للمجلد الفرعي للاحتياط
          cp android/key.properties android/app/key.properties
          
          # 4. تشغيل أمر البناء فوراً بعد توليد الملفات
          flutter build apk --release

      - name: حفظ وتوفير الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: school-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
