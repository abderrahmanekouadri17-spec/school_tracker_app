name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # يتيح لك بدء البناء يدويًا بنقرة زر

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب كود المشروع
        uses: actions/checkout@v4

      - name: تثبيت الجافا
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: تثبيت الفلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: تحميل مكتبات المشروع
        run: flutter pub get

      # 👇 هذه الخطوة السحرية التي ستحل المشكلة وتنشئ المفتاح المفقود تلقائياً
      - name: إنشاء مفتاح التوقيع المفقود تلقائياً
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=SchoolApp, OU=Dev, O=School, L=Djelfa, S=DZ, C=DZ"
          
          cat <<EOF > android/key.properties
          storePassword=123456
          keyPassword=123456
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: بناء ملف الـ APK
        run: flutter build apk --release

      - name: حفظ وتوفير الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: school-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
