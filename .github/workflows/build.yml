name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تثبيت الجافا
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: تثبيت الفلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: تثبيت الحزم
        run: flutter pub get

      # بناء APK جاهز ومباشر
      - name: بناء التطبيق الفوري
        run: flutter build apk --debug

      # 👇 البحث عن أي ملف APK تم إنتاجه ورفعه مباشرة مهما كان مساره
      - name: توفير الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: school-app-debug
          path: build/app/outputs/**/*.apk
