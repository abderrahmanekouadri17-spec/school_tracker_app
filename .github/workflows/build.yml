name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. ضبط إصدار Java 17 المتوافق مع أندرويد الحديث
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. ضبط إصدار Flutter واستخدام قناة الـ stable
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. جلب التبعيات
      - name: Install Dependencies
        run: flutter pub get

      # 4. تنظيف الكود قبل البناء لتفادي الملفات المؤقتة القديمة
      - name: Clean Project
        run: flutter clean

      # 5. بناء ملف APK بنجاح
      - name: Build APK
        run: flutter build apk --release

      # 6. رفع ملف الـ APK الناتج ليكون جاهزاً للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
