name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تثبيت الجافا 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: تثبيت الفلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: تثبيت الحزم
        run: flutter pub get

      # 👇 خطوتك الذكية لفرض إصدار مستقر ومسح النسخة المسببة للمشاكل
      - name: فرض إصدار Gradle 8.7 المستقر
        run: |
          mkdir -p android/gradle/wrapper
          cat <<EOF > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      # 👇 هذه الخطوة ستقوم بإجبار أندرويد على استخدام توقيع الـ Debug لتخطي الملف المفقود
      - name: تنظيف إعدادات التوقيع الإجبارية
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle
          fi

      # بناء ملف الـ APK
      - name: بناء التطبيق
        run: flutter build apk --debug

      # توفير الـ APK للتحميل
      - name: توفير الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: school-app-debug
          path: build/app/outputs/**/*.apk
