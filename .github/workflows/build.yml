name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب كود المشروع
        uses: actions/checkout@v4

      - name: تثبيت الجافا
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: تثبيت الفلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: تحميل مكتبات المشروع
        run: flutter pub get

      # 👇 إنشاء المفتاح في المجلدين معاً لضمان وجوده في جميع الاحتمالات
      - name: إنشاء مفتاح التوقيع وملف الإعدادات المضمون
        run: |
          # 1. إنشاء مجلد app في حال لم يكن موجوداً
          mkdir -p android/app

          # 2. توليد المفتاح
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=SchoolApp, OU=Dev, O=School, L=Djelfa, S=DZ, C=DZ"

          # 3. نسخ المفتاح أيضاً إلى مجلد android الرئيسي (أمان مضاعف)
          cp android/app/upload-keystore.jks android/upload-keystore.jks

          # 4. إنشاء ملف key.properties
          cat <<EOF > android/key.properties
          storePassword=123456
          keyPassword=123456
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: بناء ملف الـ APK
        run: flutter build apk --release

      - name: حفظ وتوفير الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: school-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
