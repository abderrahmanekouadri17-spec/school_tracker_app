name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Signing Configuration
        run: |
          # إنشاء ملف توقيع اختبار مؤقت للاستخدام على الخادم
          keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storepass android -keypass android
          # إعداد متغيرات البيئة لكي يتعرف عليها Flutter أثناء البناء
          echo "flutter.signingConfig=android/app/debug.keystore" >> android/local.properties
          echo "flutter.keyAlias=androiddebugkey" >> android/local.properties
          echo "flutter.keyPassword=android" >> android/local.properties
          echo "flutter.storePassword=android" >> android/local.properties

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
